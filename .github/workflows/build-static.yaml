name: build-static

on:
  workflow_call:

jobs:
  build:
    name: Build on ${{ join(matrix.os, ', ') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - [ubuntu-runner-set]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile debug
        run: make all
        env:
          BUILD_TYPE: Debug
          BUILD_SHARED_LIBS: OFF
          BUILD_TESTING: ON
          BUILD_INTEGRATION: ON
          BUILD_TOOLS: ON
          ZENOH_LOG: debug

  crossbuilds:
    name: Build on ubuntu-runner-set
    runs-on: ubuntu-runner-set
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Crosscompile debug
        run: make crossbuilds
        env:
          BUILD_TYPE: Debug
          BUILD_SHARED_LIBS: OFF
          ZENOH_LOG: debug
